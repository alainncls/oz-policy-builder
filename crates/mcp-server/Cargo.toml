[package]
name = "ozpb-mcp-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "rmcp server exposing recording, synthesis, reference evidence, generation, verification, exact-envelope preflight and target capture"

[[bin]]
name = "ozpb-mcp-server"
path = "src/main.rs"

[dependencies]
ozpb-toolkit = { workspace = true }
ozpb-api-types = { workspace = true }
ozpb-recorder-core = { workspace = true }
ozpb-source-rpc = { workspace = true, features = ["http"] }
rmcp = { workspace = true }
tokio = { workspace = true }
serde_json = { workspace = true }
anyhow = "1"
axum = "0.8"
# The request-body bound and its typed refusal; already in the tree through axum.
http-body-util = "0.1"
tokio-util = "0.7"
url = "2"
ureq = { workspace = true }
ozpb-domain = { workspace = true }

[dev-dependencies]
# The stdio suite drives the real binary, so it needs the same fixtures and the same development
# registry signer the toolkit tests use — otherwise the one call this milestone contracts stays
# untested at the boundary that serves it.
ozpb-synthesizer = { workspace = true }
ozpb-registry = { workspace = true }
# The shared RPC responder derives its simulation replies from the envelope under test.
stellar-xdr = { workspace = true }
# `oneshot` drives the HTTP guard without a listener; already in the tree through axum.
tower = { version = "0.5", features = ["util"] }
